<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="titel beschreibung">
  <title id="titel">Datenmodell der Demo: einmal dokumentieren, überall verwenden</title>
  <desc id="beschreibung">Jede Angabe wird einmal in einem Bestand des Praxissystems erfasst. Nur der Kern bildet sie nach FHIR ab und gibt sie an die ePA, die KIM-Nachricht und den E-Rezept-Fachdienst aus; die Patient Summary ist eine Sicht aus den Listen der ePA. Abrechnungsprüfung, AMTS-Prüfung und Verlauf lesen die Bestände direkt, ohne FHIR. Zurück in die Bestände führt fhir/lesen.ts. Ausnahme ist die Medikation: Quelle ist der Plan in der ePA, das Praxissystem hält eine datierte Kopie. Beispiel: die Diagnose Diabetes mellitus Typ 2 erscheint in der Diagnosenliste, über sie in der Patient Summary, im Arztbrief und in der Abrechnungsprüfung.</desc>
  <!-- Farben wie in packages/pvs/src/stil/global.css (docs/GESTALTUNG.md): Praxis = Variable lokal, ePA = akzent, Patient Summary = ps. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1b2430; font-size: 12.5px; }
    .titel { font-size: 21px; font-weight: 650; }
    .unter { font-size: 13px; fill: #4a5563; }
    .schritt { font-size: 12px; font-weight: 600; fill: #6b7480; letter-spacing: 0.06em; }
    .kopf { font-size: 14px; font-weight: 600; fill: #ffffff; }
    .marke { font-size: 12px; font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #6b7480; }
    .klein { font-size: 11.5px; fill: #4a5563; }
    .lokal { fill: #2c6b5c; }
    .epa { fill: #1d4a8a; }
    .ps { fill: #5a4589; }
    .warn { fill: #8f5300; }
    .gut { fill: #2d6a3e; }
    .karte { fill: #ffffff; stroke-width: 1; }
    .fluss { fill: none; stroke: #4a5563; stroke-width: 2; }
  </style>
  <defs>
    <marker id="spitze" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/></marker>
    <marker id="spitze-epa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4a8a"/></marker>
    <marker id="spitze-lokal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c6b5c"/></marker>
    <marker id="spitze-ps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a4589"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="759" rx="10" fill="#ffffff" stroke="#dfe3e8"/>

  <text class="titel" x="32" y="46">Datenmodell: einmal dokumentieren, überall verwenden</text>
  <text class="unter" x="32" y="70">Jede Angabe hat genau einen Bestand im Praxissystem. FHIR entsteht nur im Kern, an den Übergängen nach außen.</text>

  <text class="schritt" x="32" y="102">1  ERFASSEN</text>
  <text class="schritt" x="360" y="102">2  ABBILDEN</text>
  <text class="schritt" x="688" y="102">3  AUSGEBEN</text>

  <!-- 1 Erfassen: Bestände im Praxissystem -->
  <rect x="32" y="112" width="280" height="416" rx="6" fill="#f0f6f4" stroke="#c5ddd6"/>
  <path d="M32,146 V118 Q32,112 38,112 H306 Q312,112 312,118 V146 Z" fill="#2c6b5c"/>
  <text class="kopf" x="46" y="134">Praxissystem · Bestände</text>

  <text class="marke lokal" x="46" y="166">erfasst — eine Stelle je Angabe</text>
  <g stroke="#c5ddd6">
    <rect class="karte" x="46" y="174" width="252" height="24" rx="3"/>
    <rect class="karte" x="46" y="204" width="252" height="24" rx="3"/>
    <rect class="karte" x="46" y="234" width="252" height="24" rx="3"/>
    <rect class="karte" x="46" y="264" width="252" height="24" rx="3"/>
    <rect class="karte" x="46" y="294" width="252" height="24" rx="3"/>
    <rect class="karte" x="46" y="324" width="252" height="24" rx="3"/>
  </g>
  <text x="56" y="190.5">Patient · Praxis · Nutzer</text>
  <text x="56" y="220.5">Diagnosen · Allergien · Impfungen</text>
  <text x="56" y="250.5">Karteikarte (Freitext)</text>
  <text x="56" y="280.5">Dokumente (Ablage)</text>
  <text x="56" y="310.5">Rezepte</text>
  <text x="56" y="340.5">Behandlungsfälle, Leistungen</text>

  <text class="marke lokal" x="46" y="372">abgeleitet — nie eigens erfasst</text>
  <g stroke="#c5ddd6" stroke-dasharray="5 3">
    <rect class="karte" x="46" y="380" width="252" height="24" rx="3"/>
    <rect class="karte" x="46" y="410" width="252" height="24" rx="3"/>
  </g>
  <text x="56" y="396.5">Laborwerte ← aus Laborbefunden</text>
  <text x="56" y="426.5">Verlauf je Besuch</text>

  <text class="marke warn" x="46" y="458">Kopie — Ausnahme Medikation</text>
  <rect x="46" y="466" width="252" height="24" rx="3" fill="#fdf6ea" stroke="#ead3a6" stroke-dasharray="2 3"/>
  <text x="56" y="482.5">Medikationsspiegel ← Plan der ePA</text>

  <!-- 2 Abbilden: der Kern -->
  <rect x="360" y="112" width="280" height="416" rx="6" fill="#f7f8fa" stroke="#dfe3e8"/>
  <path d="M360,146 V118 Q360,112 366,112 H634 Q640,112 640,118 V146 Z" fill="#1f2b3a"/>
  <text class="kopf" x="374" y="134">Kern · Abbildung nach FHIR</text>

  <g stroke="#dfe3e8">
    <rect class="karte" x="372" y="156" width="256" height="36" rx="3"/>
    <rect class="karte" x="372" y="198" width="256" height="36" rx="3"/>
    <rect class="karte" x="372" y="240" width="256" height="36" rx="3"/>
    <rect class="karte" x="372" y="282" width="256" height="36" rx="3"/>
    <rect class="karte" x="372" y="324" width="256" height="36" rx="3"/>
    <rect class="karte" x="372" y="366" width="256" height="36" rx="3"/>
  </g>
  <text x="384" y="171">Listen ✦, Stammdaten</text>
  <text class="mono" x="384" y="185">fhir/abbildung.ts</text>
  <text x="384" y="213">Medikationsplan</text>
  <text class="mono" x="384" y="227">fhir/medikation.ts</text>
  <text x="384" y="255">Arztbrief als FHIR-Dokument</text>
  <text class="mono" x="384" y="269">fachlogik/arztbrief.ts</text>
  <text x="384" y="297">Einstellen (ITI-41), KIM</text>
  <text class="mono" x="384" y="311">fachlogik/xds.ts · kim.ts</text>
  <text x="384" y="339">E-Rezept (⚠ Demo-Ersatz)</text>
  <text class="mono" x="384" y="353">fhir/erezept.ts</text>
  <text x="384" y="381">Laborbefund nach dgLP</text>
  <text class="mono" x="384" y="395">fachlogik/laborbefund.ts</text>

  <rect x="372" y="408" width="256" height="36" rx="3" fill="#ffffff" stroke="#c9d6ea" stroke-dasharray="5 3"/>
  <text class="epa" x="384" y="423">← zurück in die Bestände</text>
  <text class="mono" x="384" y="437">fhir/lesen.ts</text>

  <rect x="372" y="454" width="256" height="28" rx="3" fill="#ffffff" stroke="#dfe3e8"/>
  <text x="384" y="472.5">Regeln R1–R9 · Abschnitt 3</text>
  <rect x="372" y="490" width="256" height="28" rx="3" fill="#f0f6f1" stroke="#c3dcc9"/>
  <text class="marke gut" x="384" y="508.5">geprüft: fhirPruefen · HL7-Validator</text>

  <!-- 3 Ausgeben: ePA -->
  <rect x="688" y="112" width="280" height="220" rx="6" fill="#f0f4fa" stroke="#c9d6ea"/>
  <path d="M688,146 V118 Q688,112 694,112 H962 Q968,112 968,118 V146 Z" fill="#1d4a8a"/>
  <text class="kopf" x="702" y="134">ePA</text>

  <g stroke="#c9d6ea">
    <rect class="karte" x="700" y="156" width="256" height="24" rx="3"/>
    <rect class="karte" x="700" y="234" width="256" height="24" rx="3"/>
    <rect class="karte" x="700" y="266" width="256" height="24" rx="3"/>
    <rect class="karte" x="700" y="298" width="256" height="24" rx="3"/>
  </g>
  <text x="710" y="172.5">Diagnosen-/Allergien-/Impfliste ✦</text>
  <rect x="716" y="188" width="240" height="38" rx="3" fill="#f5f3f9" stroke="#d3cbe4"/>
  <path d="M706,180 V207 H713" fill="none" stroke="#5a4589" stroke-width="1.5" marker-end="url(#spitze-ps)"/>
  <text class="marke ps" x="728" y="203">★ Patient Summary ✦</text>
  <text class="klein" x="728" y="219">Sicht aus den Listen der ePA</text>
  <text x="710" y="250.5">Medikationsplan</text>
  <rect x="898" y="238" width="50" height="16" rx="8" fill="#fdf6ea" stroke="#ead3a6"/>
  <text class="warn" x="923" y="250" text-anchor="middle" font-size="10.5">Quelle</text>
  <text x="710" y="282.5">Dokumente (ITI-41): Arztbrief</text>
  <text x="710" y="314.5">Medikationsliste ← E-Rezept</text>

  <!-- 3 Ausgeben: außerhalb der ePA -->
  <rect x="688" y="342" width="280" height="88" rx="6" fill="#f7f8fa" stroke="#dfe3e8"/>
  <text class="marke" x="702" y="361" fill="#4a5563">Außerhalb der ePA</text>
  <g stroke="#dfe3e8">
    <rect class="karte" x="700" y="368" width="256" height="24" rx="3"/>
    <rect class="karte" x="700" y="398" width="256" height="24" rx="3"/>
  </g>
  <text x="710" y="384.5">KIM-Nachricht mit dem Arztbrief</text>
  <text x="710" y="414.5">E-Rezept-Fachdienst ⚠</text>

  <!-- 3 Ausgeben: im Praxissystem, ohne FHIR -->
  <rect x="688" y="440" width="280" height="88" rx="6" fill="#f0f6f4" stroke="#c5ddd6"/>
  <text class="marke lokal" x="702" y="459">Im Praxissystem, ohne FHIR</text>
  <rect class="karte" x="700" y="466" width="256" height="50" rx="3" stroke="#c5ddd6"/>
  <text x="710" y="486">Abrechnungsprüfung · AMTS-Prüfung</text>
  <text x="710" y="505">Verlauf der Karteikarte</text>

  <!-- Flüsse -->
  <path class="fluss" d="M314,250 H355" marker-end="url(#spitze)"/>
  <path class="fluss" d="M642,206 H683" marker-end="url(#spitze)"/>
  <path class="fluss" d="M642,386 H683" marker-end="url(#spitze)"/>
  <!-- zurück: aus der ePA über fhir/lesen.ts in die Bestände, darunter der Spiegel des Plans -->
  <path d="M688,246 H664 V426 H633" fill="none" stroke="#1d4a8a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#spitze-epa)"/>
  <path d="M372,426 H338 V478 H303" fill="none" stroke="#1d4a8a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#spitze-epa)"/>
  <text class="epa" x="336" y="418" text-anchor="middle" font-size="10.5">zurück</text>
  <!-- ohne FHIR: Abrechnung, AMTS und Verlauf lesen die Bestände direkt -->
  <path d="M172,528 V548 H828 V533" fill="none" stroke="#2c6b5c" stroke-width="2" marker-end="url(#spitze-lokal)"/>
  <text class="lokal" x="500" y="566" text-anchor="middle" font-size="11.5">Abrechnungsprüfung, AMTS-Prüfung und Verlauf lesen die Bestände direkt — ohne FHIR</text>

  <!-- Beispiel -->
  <line x1="32" y1="584" x2="968" y2="584" stroke="#dfe3e8"/>
  <text x="32" y="612" font-size="13" font-weight="600">Beispiel: eine Diagnose von Renate Hoffmann</text>

  <rect x="32" y="626" width="230" height="46" rx="4" fill="#f0f6f4" stroke="#c5ddd6"/>
  <text class="marke lokal" x="44" y="645">Diabetes mellitus Typ 2</text>
  <text class="mono" x="44" y="662" fill="#4a5563">E11.90 · G · aktiv · Dauerdiagnose</text>
  <path class="fluss" d="M264,649 H297" marker-end="url(#spitze)"/>
  <rect x="302" y="626" width="230" height="46" rx="4" fill="#f7f8fa" stroke="#dfe3e8"/>
  <text x="314" y="645">einmal abgebildet: Condition</text>
  <text class="mono" x="314" y="662">ti-condition-diagnosis 1.5.0</text>

  <path class="fluss" d="M534,649 C566,649 566,611 595,611" marker-end="url(#spitze)"/>
  <path class="fluss" d="M534,649 C566,649 566,687 595,687" marker-end="url(#spitze)"/>
  <path d="M147,672 V725 H595" fill="none" stroke="#2c6b5c" stroke-width="2" marker-end="url(#spitze-lokal)"/>

  <rect x="600" y="598" width="368" height="26" rx="3" fill="#f0f4fa" stroke="#c9d6ea"/>
  <text class="epa" x="612" y="615.5">Diagnosenliste der ePA ✦</text>
  <rect x="624" y="636" width="344" height="26" rx="3" fill="#f5f3f9" stroke="#d3cbe4"/>
  <path d="M610,624 V649 H621" fill="none" stroke="#5a4589" stroke-width="1.5" marker-end="url(#spitze-ps)"/>
  <text class="ps" x="636" y="653.5">★ Patient Summary ✦ — über die Liste, wenn markiert</text>
  <rect x="600" y="674" width="368" height="26" rx="3" fill="#ffffff" stroke="#dfe3e8"/>
  <text x="612" y="691.5">Arztbrief: Abschnitt Diagnosen</text>
  <rect x="600" y="712" width="368" height="26" rx="3" fill="#f0f6f4" stroke="#c5ddd6"/>
  <text class="lokal" x="612" y="729.5">Abrechnungsprüfung: ICD-10-GM und Zusatzkennzeichen</text>
</svg>
