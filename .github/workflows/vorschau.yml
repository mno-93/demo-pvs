# Hält die Vorschauen aktuell (ADR 0025, Nachtrag „Vorschau eines Branchs“).
#
# Veröffentlichen darf nur main (demo.yml). Ändert sich ein Branch aus
# .github/vorschau-branches.txt und hat demo.yml ihn dort ohne Fehler geprüft, stößt dieser Lauf
# demo.yml auf main an; der baut main und die Vorschauen und veröffentlicht beides. Eigener Code
# des Branchs läuft hier nicht — gelesen wird nur die Liste aus main.
name: Vorschau aktualisieren

on:
  workflow_run:
    workflows: ['Prüfen und veröffentlichen']
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  anstossen:
    name: Veröffentlichung auf main anstoßen
    # Nur geprüfte Stände aus dem Repository selbst, nie aus Forks; main veröffentlicht ohnehin.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/vorschau-branches.txt
          sparse-checkout-cone-mode: false
      - name: Steht der Branch in der Liste?
        id: liste
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if grep -v '^#' .github/vorschau-branches.txt | grep -Fxq -- "$BRANCH"; then
            echo "vorschau=ja" >> "$GITHUB_OUTPUT"
          else
            echo "Kein Vorschau-Branch — nichts zu tun."
          fi
      - name: demo.yml auf main starten
        if: steps.liste.outputs.vorschau == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run demo.yml --repo "$GITHUB_REPOSITORY" --ref main
