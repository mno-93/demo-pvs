    id: schritte
    attributes:
      label: Schritte
      placeholder: |
        1. Frau Hoffmann öffnen
        2. „eGK einlesen"
        3. …
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Erwartet und tatsächlich
